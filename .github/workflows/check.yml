name: Check

# Every push: every addon must follow FORMAT.md
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install lupa
      run: pip install lupa
    - name: Check addons
      run: python3 tools/check_addons.py
