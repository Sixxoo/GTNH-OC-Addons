name: Check

# Every push: every addon follows FORMAT.md and every test passes
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install lupa and pillow
      run: pip install lupa pillow
    - name: Check addons
      run: python3 tools/check_addons.py
    - name: Run tests
      run: python3 testkit/run.py
    - name: Keep screen snapshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: snapshots
        path: testkit/out/
        if-no-files-found: ignore
